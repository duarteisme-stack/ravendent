<!-- Supabase > Authentication > Emails > Confirm signup. Subject: Confirm your RavenDent account -->
<div style="background:#0B0B0F;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#F5F5F7">
  <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#20202B;border:1px solid #3a3a48;border-radius:8px">
    <tr><td style="padding:32px">
      <p style="margin:0 0 4px;font-family:Georgia,serif;font-size:26px">RavenDent</p>
      <h1 style="margin:24px 0 8px;font-family:Georgia,serif;font-weight:normal;font-size:28px">Confirm your email</h1>
      <p style="margin:0 0 24px;line-height:1.6;color:#C4C7D0">Thanks for creating an account. Confirm your email address to finish setting up and complete your patient profile.</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard/profile"
         style="display:inline-block;background:#8B1E2D;color:#F5F5F7;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:600">Confirm email</a>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#9B9BA8">If you did not create a RavenDent account, you can ignore this message. The link works on any device.</p>
    </td></tr>
  </table>
</div>
